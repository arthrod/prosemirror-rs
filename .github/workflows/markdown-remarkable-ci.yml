name: markdown-remarkable CI

# The viewer crate is excluded from the root workspace (it pulls in native
# GUI dependencies). GitHub only runs workflows from this directory, so the
# checks that used to live under apps/markdown-remarkable/.github are here
# and select that crate explicitly.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/markdown-remarkable/target
          key: ${{ matrix.os }}-markdown-remarkable-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --manifest-path apps/markdown-remarkable/Cargo.toml -p markdown-remarkable -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path apps/markdown-remarkable/Cargo.toml -p markdown-remarkable --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path apps/markdown-remarkable/Cargo.toml -p markdown-remarkable
