<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prosemirror-rs</title>
  </head>
  <body>
    <div class="container">
      <h1>prosemirror-rs</h1>
      <p id="blurb">
        Basic and advanced editors on the Rust engine. Formatting, lists, history,
        tables, and the 200ms collaborative replay are unchanged.
      </p>
      <p id="engine">Document engine starting…</p>
      <div class="modes" role="tablist" aria-label="Demo">
        <button type="button" id="mode-basic" role="tab" aria-selected="true">Basic</button>
        <button type="button" id="mode-advanced" role="tab" aria-selected="false">Advanced</button>
      </div>
      <div id="basic-root"></div>
      <div id="advanced-root" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
